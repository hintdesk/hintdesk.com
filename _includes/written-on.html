{% assign author = include.author | default : '' %}

{% if site.written-on.enabled and author.size > 0 %}
{% assign name = site.data.authors[author].name | default : '' %}
{% if name.size > 0 %}
<span class="article-meta">
  <time datetime="{{ include.date | date_to_xmlschema }}">{{ include.date | date: "%b %-d, %Y" }}</time>
  <span>&middot;</span>
  <span>{{ name }}</span>
</span>
{% endif %}
{% endif %}
